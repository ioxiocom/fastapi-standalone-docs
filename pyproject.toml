[project]
name = "fastapi-standalone-docs"
version = "0.3.0"
description = "Host FastAPI Swagger UI and ReDoc without third party CDNs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IOXIO Ltd" }]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.133.0,<1"]
keywords = ["fastapi", "swagger", "swagger-ui", "redoc", "openapi", "offline"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation",
]

[project.urls]
Homepage = "https://github.com/ioxiocom/fastapi-standalone-docs"
Issues = "https://github.com/ioxiocom/fastapi-standalone-docs/issues"

[project.scripts]
update-fastapi-standalone-docs = "fastapi_standalone_docs.scripts:update_docs"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.4.0",
    "httpx2>=2.13.1",
    "invoke>=3.0.3",
    "pre-commit>=4.6.2",
    "ruff==0.17.0",  # keep in sync with the ruff-pre-commit rev
]

[tool.uv]
required-version = ">=0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
files = ["src", "tests"]
warn_return_any = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W: pycodestyle; F: Pyflakes; I: isort; UP: pyupgrade; B: flake8-bugbear;
# SIM: flake8-simplify; RUF: Ruff-specific rules
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
