# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)(
            ^src/fastapi_standalone_docs/static/.*$
          )
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            ^src/fastapi_standalone_docs/static/.*$
          )
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: |
          (?x)(
            ^src/fastapi_standalone_docs/static/.*$
          )
      - id: check-merge-conflict
      - id: debug-statements
      # All non-bat files should end with LF
      - id: mixed-line-ending
        name: Ensure LF endings on most files
        args: ["--fix=lf"]
        exclude: \.bat$
      # Bat files should end with CRLF
      - id: mixed-line-ending
        name: Ensure CFLF endings on Windows files
        args: ["--fix=crlf"]
        files: \.bat$
  # Keep the rev in sync with the ruff pin in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        exclude: |
          (?x)(
            ^src/fastapi_standalone_docs/static/.*$
          )
